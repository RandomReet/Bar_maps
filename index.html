<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Карта мест</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.2.0/dist/maplibre-gl.css" />

  <style>
    html, body { height: 100%; margin: 0; background: #0b0f19; }
    #map { height: 100%; width: 100%; }

    .place-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.85);
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
      background: rgba(255,255,255,0.08);
    }
    .place-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .popup-link { display: inline-block; margin-top: 6px; color: #2ea8ff; text-decoration: none; }
    .popup-title { font-weight: 700; margin-bottom: 6px; }

    /* ========= FULLSCREEN HERO MODAL ========= */
    .place-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(6, 10, 20, 0.72);
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease;
    }
    .place-modal.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .place-modal__panel {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    /* “обложка”, которая анимируется из маркера */
    .place-hero {
      position: absolute;
      z-index: 0;
      width: 100%;
      height: 100%;
      transform: translate(50%, 50%) scale(1);
      transform-origin: center;
      transition: transform 320ms cubic-bezier(.2,.9,.2,1),
                  border-radius 320ms cubic-bezier(.2,.9,.2,1);
    }

    

    .place-hero__top {
      position: absolute;
      background: linear-gradient(to bottom, rgba(0,0,0,0.62), rgba(0,0,0,0));
      pointer-events: none;
      left: 0; right: 0; top: 0;
      padding: 16px;
    }

    .place-hero__title {
      font-size: clamp(18px, 4.5vw, 30px);
      font-weight: 800;
      line-height: 1.05;
      color: #fff;
      text-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .place-hero__bottom {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 16px;
      background: linear-gradient(to top, rgba(0,0,0,0.72), rgba(0,0,0,0));
      color: #d7e7ff;
    }

    .place-hero__address {
      opacity: 0.95;
      color: #fff;
      font-size: 14px;
      margin-bottom: 10px;
      text-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .place-hero__tag {
      opacity: 0.9;
      font-size: 13px;
      margin-bottom: 12px;
      text-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .place-hero__link {
      display: inline-block;
      color: #2ea8ff;
      text-decoration: none;
      font-weight: 700;
      text-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .place-modal__close {
      position: absolute;
      top: 14px; right: 14px;
      z-index: 2;
      width: 40px; height: 40px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(10,15,30,0.35);
      color: #fff;
      cursor: pointer;
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      line-height: 1;
    }
    .place-modal__close:active { transform: scale(0.98); }

    /* ========= HERO GALLERY ========= */
    .place-gallery {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }
    .place-gallery__track {
      height: 100%;
      display: flex;
      transition: transform 280ms ease;
      will-change: transform;
    }
    .place-gallery__slide {
      flex: 0 0 100%;
      height: 100%;
      position: relative;
    }
    .place-gallery__slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(1.0);
    }

    .place-gallery__nav {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    .place-gallery__btn {
      pointer-events: auto;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(10,15,30,0.35);
      color: #fff;
      cursor: pointer;
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .place-gallery__btn:active { transform: translateY(-50%) scale(0.98); }
    .place-gallery__btn--prev { left: 14px; }
    .place-gallery__btn--next { right: 14px; }

    .place-gallery__hint {
      position: absolute;
      left: 50%;
      bottom: 70px;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.85);
      font-size: 12px;
      text-shadow: 0 10px 30px rgba(0,0,0,0.35);
      z-index: 1;
      pointer-events: none;
      opacity: 0.9;
    }

        /* bottom sheet */
    .place-more-btn{
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      background: transparent;
      color: transparent;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      border: 0;

      position: absolute;
      left: 50%;
      bottom: 70px;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.85);
      font-size: 20px;
      text-shadow: 0 10px 30px rgba(0,0,0,0.35);
      opacity: 0.9;
      
    }

    .place-more-btn:focus-visible{
      outline: 2px solid rgba(46,168,255,0.9);
      outline-offset: 4px;
    }

    .place-sheet{
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      top: 0; 

      /* прячем снизу */
      transform: translateY(90%);
      transition: transform 1260ms cubic-bezier(.2,.9,.2,1);

      /* чтобы выглядело как “лист” */
      background: rgba(5, 10, 25, 0.55);
      backdrop-filter: blur(10px);
      border-top-left-radius: 18px;
      border-top-right-radius: 18px;

      max-height: 100%;
      overflow: auto;

      /* поверх картинки */
      z-index: 5;
    }

    .place-sheet.is-opened{
      transform: translateY(0%);
    }

    .place-sheet__handle{
      width: 52px;
      height: 5px;
      border-radius: 999px;
      background: rgba(255,255,255,0.28);
      margin: 10px auto 8px;
    }

    .place-sheet__content{
      padding: 0 16px 16px;
      color: #d7e7ff;
    }

    .place-sheet__title{
      font-weight: 800;
      margin-bottom: 10px;
    }

    .place-sheet__text{
      font-size: 14px;
      line-height: 1.45;
      opacity: 0.95;
      white-space: pre-wrap; /* чтобы переносы сохранились */
    }

  </style>
</head>

<body>
  <div id="map"></div>

  <!-- Fullscreen modal -->
  <div class="place-modal" id="placeModal" aria-hidden="true">
    <div class="place-modal__panel">
      <button class="place-modal__close" id="placeModalClose" type="button" aria-label="Закрыть">✕</button>

      <div class="place-hero" id="placeHero" aria-hidden="true">
        <div class="place-gallery" aria-label="Галерея изображений">
          <div class="place-gallery__track" id="placeGalleryTrack"></div>

          <div class="place-gallery__nav">
            <button class="place-gallery__btn place-gallery__btn--prev" id="galleryPrev" type="button" aria-label="Предыдущее изображение">‹</button>
            <button class="place-gallery__btn place-gallery__btn--next" id="galleryNext" type="button" aria-label="Следующее изображение">›</button>
          </div>

          <div class="place-gallery__hint"></div>

        </div>

        <div class="place-hero__top">
          <div class="place-hero__title" id="placeHeroTitle"></div>
          <div class="place-hero__address" id="placeHeroAddress"></div>

        </div>

        <!-- Новое: выезжающий снизу блок -->
          <div class="place-sheet" id="placeSheet">
            <div class="place-sheet__handle" aria-hidden="true"></div>
            <div class="place-sheet__content">
              <div class="place-sheet__title">Читать описание</div>
              <div class="place-sheet__text" id="placeSheetText"></div>
            </div>
          </div>

        <div class="place-hero__bottom">
          <div class="place-hero__tag" id="placeHeroTag"></div>

          <a class="place-hero__link" id="placeHeroLink" target="_blank" rel="noopener" href="#"></a>

          <!-- Новое: кнопка -->


          <button class="place-more-btn" id="placeMoreBtn" type="button">
            Подробнее
          </button>

        
        </div>

      </div>
    </div>
  </div>
<!-- Удален <script src="places.js"></script> -->
<script src="https://unpkg.com/maplibre-gl@5.2.0/dist/maplibre-gl.js"></script>

<script>
  const MAP_CENTER = [55.768390, 37.646372]; // [lat, lng]
  const MAP_ZOOM = 15;

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, s => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[s]));
  }

  function createMarkerElement(imageUrl) {
    const el = document.createElement('div');
    el.className = 'place-icon';

    const img = document.createElement('img');
    img.alt = '';
    img.onerror = () => { img.style.display = 'none'; };
    if (imageUrl) img.src = imageUrl;

    el.appendChild(img);
    return el;
  }

  // ========= Modal logic =========
  const placeModal = document.getElementById('placeModal');
  const placeHero = document.getElementById('placeHero');
  const placeModalClose = document.getElementById('placeModalClose');
  const placeHeroTitle = document.getElementById('placeHeroTitle');
  const placeHeroAddress = document.getElementById('placeHeroAddress');
  const placeHeroTag = document.getElementById('placeHeroTag');
  const placeHeroLink = document.getElementById('placeHeroLink');
  const placeGalleryTrack = document.getElementById('placeGalleryTrack');
  const galleryPrev = document.getElementById('galleryPrev');
  const galleryNext = document.getElementById('galleryNext');
  const placeMoreBtn = document.getElementById('placeMoreBtn');
  const placeSheet = document.getElementById('placeSheet');
  const placeSheetText = document.getElementById('placeSheetText');

  placeMoreBtn.style.display = 'none';
  let isModalOpen = false;
  let galleryImages = [];
  let galleryIndex = 0;

  function updateGalleryNav() {
    const total = galleryImages.length;
    const canPrev = total > 1 && galleryIndex > 0;
    const canNext = total > 1 && galleryIndex < total - 1;
    galleryPrev.style.opacity = canPrev ? '1' : '0.45';
    galleryNext.style.opacity = canNext ? '1' : '0.45';
    galleryPrev.disabled = !canPrev;
    galleryNext.disabled = !canNext;
    galleryPrev.style.pointerEvents = canPrev ? 'auto' : 'none';
    galleryNext.style.pointerEvents = canNext ? 'auto' : 'none';
  }

  function setGalleryIndex(i) {
    const total = galleryImages.length;
    if (!total) return;
    galleryIndex = Math.max(0, Math.min(i, total - 1));
    placeGalleryTrack.style.transform = `translateX(${-galleryIndex * 100}%)`;
    updateGalleryNav();
  }

  function renderGallery(images = []) {
    galleryImages = Array.isArray(images) ? images : [];
    galleryIndex = 0;
    placeGalleryTrack.innerHTML = '';
    if (!galleryImages.length) galleryImages = [''];
    for (const url of galleryImages) {
      const slide = document.createElement('div');
      slide.className = 'place-gallery__slide';
      const img = document.createElement('img');
      img.alt = '';
      img.onerror = () => { img.style.display = 'none'; };
      if (url) img.src = url;
      slide.appendChild(img);
      placeGalleryTrack.appendChild(slide);
    }
    placeGalleryTrack.style.transform = `translateX(0%)`;
    updateGalleryNav();
  }

  galleryPrev.addEventListener('click', (e) => {
    e.preventDefault(); e.stopPropagation();
    setGalleryIndex(galleryIndex - 1);
  });

  galleryNext.addEventListener('click', (e) => {
    e.preventDefault(); e.stopPropagation();
    setGalleryIndex(galleryIndex + 1);
  });

  (function enableSwipe() {
    let startX = 0, startY = 0, isDown = false;
    placeHero.addEventListener('pointerdown', (e) => {
      if (!isModalOpen) return;
      isDown = true; startX = e.clientX; startY = e.clientY;
    });
    placeHero.addEventListener('pointerup', (e) => {
      if (!isDown) return;
      isDown = false;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (Math.abs(dy) > Math.abs(dx) * 1.2) return;
      const threshold = 45;
      if (dx > threshold) setGalleryIndex(galleryIndex - 1);
      else if (dx < -threshold) setGalleryIndex(galleryIndex + 1);
    });
    placeHero.addEventListener('pointercancel', () => { isDown = false; });
  })();

  function openPlaceModal(p, fromEl) {
    renderGallery(p.images);
    placeSheetText.textContent = p.description || '—';
    setSheetOpened(false);
    placeHeroTitle.textContent = p.title || '';
    placeHeroAddress.textContent = p.address || '';
    placeHeroTag.textContent = p.tag || '';
    placeHeroTag.style.display = p.tag ? '' : 'none';
    if (p.link) {
      placeHeroLink.href = p.link;
      placeHeroLink.style.display = '';
    } else {
      placeHeroLink.style.display = 'none';
    }

    const rect = fromEl.getBoundingClientRect();
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const startScaleX = rect.width / vw;
    const startScaleY = rect.height / vh;
    const startX = rect.left;
    const startY = rect.top;

    placeModal.classList.add('is-open');
    placeModal.setAttribute('aria-hidden', 'false');
    isModalOpen = true;
    placeHero.style.transition = 'none';
    placeHero.style.borderRadius = '10px';
    placeHero.style.transform = `translate(${startX}px, ${startY}px) scale(${startScaleX}, ${startScaleY})`;

    placeHero.getBoundingClientRect();
    requestAnimationFrame(() => {
      placeHero.style.transition = 'transform 320ms cubic-bezier(.2,.9,.2,1), border-radius 320ms cubic-bezier(.2,.9,.2,1)';
      placeHero.style.borderRadius = '0px';
      placeHero.style.transform = 'translate(0px, 0px) scale(1, 1)';
    });
  }

  function setSheetOpened(opened){
    placeSheet.classList.toggle('is-opened', opened);
  }

  function closePlaceModal() {
    if (!isModalOpen) return;
    placeModal.classList.remove('is-open');
    placeModal.setAttribute('aria-hidden', 'true');
    isModalOpen = false;
  }

  placeModalClose.addEventListener('click', (e) => {
    e.preventDefault(); e.stopPropagation();
    closePlaceModal();
  });

  placeMoreBtn.addEventListener('click', (e) => {
    e.preventDefault(); e.stopPropagation();
    setSheetOpened(!placeSheet.classList.contains('is-opened'));
  });

  placeSheet.addEventListener('click', (e) => {
    e.preventDefault(); e.stopPropagation();
    setSheetOpened(!placeSheet.classList.contains('is-opened'));
  });

  placeModal.addEventListener('click', (e) => {
    if (e.target === placeModal) closePlaceModal();
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closePlaceModal();
    if (!isModalOpen) return;
    if (e.key === 'ArrowLeft') setGalleryIndex(galleryIndex - 1);
    if (e.key === 'ArrowRight') setGalleryIndex(galleryIndex + 1);
  });

  // ========= Map =========
  if (typeof maplibregl === 'undefined') {
    throw new Error('maplibregl missing');
  }

  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        osm: {
          type: 'raster',
          tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
          tileSize: 256,
          attribution: '&copy; OpenStreetMap contributors'
        }
      },
      layers: [{
        id: 'osm-tiles',
        type: 'raster',
        source: 'osm',
        minzoom: 0,
        maxzoom: 19
      }]
    },
    center: [MAP_CENTER[1], MAP_CENTER[0]],
    zoom: MAP_ZOOM,

    minZoom: 0,
    maxZoom: 18   // <-- поставь нужное значение
  });


  const markerEls = [];
  const BASE_SIZE = 44; // текущее из CSS: 44x44

  // Функция для создания маркеров из массива данных
  function loadPlaces(places) {
    places.forEach(p => {
      const markerImg = p.icon || (p.images && p.images.length) ? p.images[0] : '';
      const el = createMarkerElement(markerImg);
      markerEls.push(el);
      el.style.cursor = 'pointer';

      const popupHtml = `
        <div class="popup-title">${escapeHtml(p.title || '')}</div>
        <div>${escapeHtml(p.address || '')}</div>
        ${p.tag ? `<div>${escapeHtml(p.tag)}</div>` : ''}
      `;

      const popup = new maplibregl.Popup({ offset: [0, -40], closeButton: false }).setHTML(popupHtml);

      new maplibregl.Marker({ element: el, anchor: 'bottom' })
        .setLngLat([p.lng, p.lat])
        .setPopup(popup)
        .addTo(map);

      el.addEventListener('click', (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        openPlaceModal(p, el);
      });
    });
  }

  function updateMarkerSizes() {
    if (!markerEls.length) return;
    const z = map.getZoom();


    const minZ = 10;
    const maxZ = 20;

    const t = Math.max(0, Math.min(1, (z - minZ) / (maxZ - minZ))); // 0..1
    const size = (BASE_SIZE / 1.5) + (BASE_SIZE / 1.5) * t; // от 22 до 44

    markerEls.forEach(el => {
      el.style.width = `${size}px`;
      el.style.height = `${size}px`;
    });
  }

map.on('zoom', updateMarkerSizes);


  // Загружаем JSON данные после инициализации карты
  map.on('load', async () => {
  try {
    const response = await fetch(`places.json?v=${Date.now()}`);
    if (!response.ok) throw new Error('Failed to load places.json');
    const placesData = await response.json();

    loadPlaces(placesData);
    updateMarkerSizes(); // <-- ВАЖНО: после loadPlaces
    console.log('Places loaded successfully');
  } catch (err) {
    console.error('Error loading places:', err);
  }
});




</script>

</body>
</html>
